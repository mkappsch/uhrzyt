<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uhrzyt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}html,body{overscroll-behavior:none}</style>
<title>Uhrzyt Lerne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the app always fills the screen. Two arrangements only:
   stacked (upright and squarish screens) and side by side (wide screens).
   Every size comes from the tokens below, so controls look the same everywhere and scale smoothly. */
:root{
  --bg:#eef4f1; --paper:#ffffff; --ink:#1f2a33; --muted:#5f6f78;
  --hour:#2a6fdb; --minute:#f2762e; --good:#2f9e5b; --bad:#d64545;
  --face:#fffdf7; --rim:#1f2a33; --wedge:rgba(242,118,46,.16); --line:#d6e0dc;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* spacing and control sizes */
  --pad:clamp(8px,2vmin,24px);
  --gap:clamp(6px,1.5vmin,14px);
  --tap:clamp(48px,7vmin,64px);     /* action buttons: ±, Prüefe, Nöchschti, answers */
  --tab:clamp(44px,6vmin,56px);     /* mode tabs, ⚙, read aloud */
  --radius:clamp(12px,1.8vmin,18px);
  --vh:100vh;
}
@supports (height:100dvh){:root{--vh:100dvh}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b20; --paper:#1d262d; --ink:#eef2f4; --muted:#9fb0b9;
  --hour:#6aa2ff; --minute:#ff9a5c; --good:#4cc47e; --bad:#ff7070;
  --face:#232e36; --rim:#e6ecef; --wedge:rgba(255,154,92,.2); --line:#33424c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b20; --paper:#1d262d; --ink:#eef2f4; --muted:#9fb0b9;
  --hour:#6aa2ff; --minute:#ff9a5c; --good:#4cc47e; --bad:#ff7070;
  --face:#232e36; --rim:#e6ecef; --wedge:rgba(255,154,92,.2); --line:#33424c; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;font:inherit}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--hour);outline-offset:2px}

/* ---------- page grid ---------- */
.wrap{box-sizing:border-box;min-height:var(--vh);max-width:720px;margin:0 auto;
  padding:max(var(--pad),env(safe-area-inset-top,0px)) max(var(--pad),env(safe-area-inset-right,0px)) max(var(--pad),env(safe-area-inset-bottom,0px)) max(var(--pad),env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(200px,1fr) auto;
  grid-template-areas:"top" "clock" "panel";gap:var(--gap)}
.main{display:contents}
.top{grid-area:top;container-type:inline-size;display:flex;flex-direction:column;gap:var(--gap)}
.clockbox{grid-area:clock;position:relative;min-width:0}
.clockbox svg{position:absolute;inset:0}
.panel{grid-area:panel;container-type:inline-size;display:flex;flex-direction:column;gap:var(--gap);min-width:0}

/* wide screens: clock on the left, as tall as the screen allows; everything else on the right */
@media (min-aspect-ratio:6/5){
  /* clock as tall as the screen allows, but the right column always keeps at least 300px */
  .wrap{--clock:min(calc(var(--vh) - 2*var(--pad)),52vw,calc(100vw - 2*var(--pad) - 3vw - 300px),720px);max-width:1320px;
    grid-template-columns:var(--clock) minmax(0,1fr);grid-template-rows:auto auto;
    grid-template-areas:"clock top" "clock panel";column-gap:clamp(12px,3vw,48px);align-content:center}
  .clockbox{align-self:center;width:var(--clock);height:var(--clock)}
  .panel{align-self:start}
}

/* ---------- header and mode tabs ---------- */
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,7cqi,2.4rem);margin:0;line-height:1;white-space:nowrap}
h1 span{color:var(--minute)}
.hd{display:flex;align-items:center;gap:var(--gap)}
.score{display:inline-block;font-family:var(--display);font-weight:800;font-size:clamp(1rem,4.5cqi,1.35rem);color:var(--minute);font-variant-numeric:tabular-nums;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 14px;line-height:1.6}
/* settings button shows the current level, so people see there is something to change */
.gear{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;min-width:var(--tab);height:var(--tab);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 12px 0 10px;
  font-weight:800;font-size:clamp(.85rem,3.8cqi,1.1rem);white-space:nowrap}
.gear svg{width:calc(var(--tab) * .5);height:calc(var(--tab) * .5);fill:var(--muted);flex:none}
.gear.new{border-color:var(--minute)}
@media (prefers-reduced-motion:no-preference){.gear.new{animation:nudge 2.4s ease-in-out 1s infinite}}
@keyframes nudge{0%,70%,100%{box-shadow:0 0 0 0 rgba(242,118,46,0)}80%{box-shadow:0 0 0 6px rgba(242,118,46,.35)}}
.tip{position:absolute;right:0;top:calc(100% + 10px);z-index:10;max-width:min(280px,90cqi);background:var(--ink);color:var(--bg);
  border:0;border-radius:14px;padding:10px 36px 10px 14px;font-weight:700;font-size:.95rem;line-height:1.3;text-align:left;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip::before{content:"";position:absolute;right:22px;top:-7px;border:8px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.tip::after{content:"✕";position:absolute;right:12px;top:9px;opacity:.6}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);padding:4px;border-radius:calc(var(--radius) + 4px);border:2px solid var(--line)}
.tabs button{font-weight:800;font-size:clamp(.85rem,4.4cqi,1.2rem);white-space:nowrap;border:0;border-radius:var(--radius);padding:0 4px;min-height:var(--tab);background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- clock face ---------- */
svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.face{fill:var(--face);stroke:var(--rim);stroke-width:6}
.tick{stroke:var(--rim)}
.num{font-family:var(--display);font-weight:800;font-size:28px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.mnum{font-family:var(--body);font-weight:800;font-size:12px;fill:var(--minute);text-anchor:middle;dominant-baseline:central}
.side{font-family:var(--display);font-weight:800;font-size:22px;fill:var(--muted);text-anchor:middle;opacity:.55}
.hand-h{stroke:var(--hour);stroke-width:13;stroke-linecap:round}
.hand-m{stroke:var(--minute);stroke-width:8;stroke-linecap:round}
.knob{fill:var(--rim)}
.grip-h{fill:var(--hour)} .grip-m{fill:var(--minute)}
.hit{stroke:transparent;stroke-linecap:round}
#gh.active .hand-h{stroke-width:17} #gm.active .hand-m{stroke-width:12}
.wedge{fill:var(--wedge)}

/* ---------- phrase box: same design everywhere; round read-aloud button on the right ---------- */
.say{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:calc(var(--radius) + 4px);
  padding:var(--gap) calc(var(--tab) + 2*var(--gap)) var(--gap) var(--gap);min-height:calc(var(--tab) + 2*var(--gap));box-sizing:border-box;
  text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.say .label{font-size:clamp(.7rem,2.6cqi,.85rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.say.ask .label{font-family:var(--display);font-size:clamp(1.2rem,6cqi,2rem);letter-spacing:0;text-transform:none;color:var(--ink)}
.say.ask .ch{display:none}
.say .ch{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,7.5cqi,2.6rem);line-height:1.1;text-wrap:balance}
.say .ch .m{color:var(--minute)} .say .ch .h{color:var(--hour)}
.say .sub{font-size:clamp(.85rem,3.6cqi,1.1rem)}
.say .de{color:var(--muted);font-weight:700}
.say .dig{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.say .dig:not(:empty)::before{content:" · "}
.speak{position:absolute;right:var(--gap);top:50%;transform:translateY(-50%)}
.speak .play{border:0;border-radius:999px;width:var(--tab);height:var(--tab);padding:0;background:var(--hour);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:0}
.speak .play svg{width:45%;height:45%;fill:currentColor}

/* ---------- buttons, answers, answer row ---------- */
.btn{font-weight:800;font-size:clamp(1rem,4.2cqi,1.3rem);line-height:1.15;border:2px solid var(--line);border-radius:var(--radius);padding:4px 8px;min-height:var(--tap);min-width:0;cursor:pointer;background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--minute);border-color:var(--minute);color:#1f1205}
.btn.h{color:var(--hour)} .btn.m{color:var(--minute)}
.row{display:flex;gap:var(--gap)}
.row .btn{flex:1}
#controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.opts .btn{font-family:var(--display);font-size:clamp(.95rem,4cqi,1.3rem);padding:4px 6px;text-wrap:balance;min-height:max(var(--tap),calc(2.3em + 12px))} /* room for two lines, so the row never jumps */
.opts .btn.right{background:var(--good);border-color:var(--good);color:#06210f}
.opts .btn.wrong{border-color:var(--bad);color:var(--bad)}
.dock{display:flex;align-items:center;gap:var(--gap)}
.dock .feedback{flex:1 1 0;min-width:0}
.dock .row{flex:1.3 1 0;min-width:0}
.feedback{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,4.6cqi,1.5rem);line-height:1.1}
.feedback:empty{display:none}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.hint{font-size:clamp(.8rem,3.2cqi,.95rem);color:var(--muted);text-align:center;margin:0;max-width:60ch;margin-inline:auto}
.hint b.h{color:var(--hour)} .hint b.m{color:var(--minute)}
body:not([data-mode="lern"]) .hint{display:none}
@media (max-height:440px){.hint{display:none}}

/* ---------- settings dialog ---------- */
dialog#settings{border:0;padding:0;background:transparent;color:var(--ink);width:min(440px,calc(100vw - 32px));max-height:calc(var(--vh) - 24px)}
dialog#settings::backdrop{background:rgba(10,15,20,.55)}
.sheet{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;font-family:var(--body)}
.sheet h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.6rem;line-height:1}
.set-row{display:flex;flex-direction:column;gap:8px}
.set-inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.set-label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.levels{display:grid;grid-template-columns:1fr;gap:6px}
.levels button{font-weight:800;border:2px solid var(--line);border-radius:12px;min-height:50px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;text-align:left;background:transparent;color:var(--muted);cursor:pointer}
.levels button[aria-pressed="true"]{border-color:var(--minute);color:var(--ink)}
.levels small{font-weight:700;color:var(--muted);font-size:.85rem}
.toggle{font-weight:800;border:2px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-height:44px;padding:6px 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle svg{width:22px;height:22px;fill:currentColor}
.toggle[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.sheet .btn{min-height:52px}

/* ---------- motion ---------- */
.score.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
.fb-star{display:inline-block}
.feedback.ok .fb-star{animation:spin .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.4) rotate(15deg)}100%{transform:scale(1) rotate(0)}}
.feedback.no{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:34px;line-height:1;color:#ffc531;text-shadow:0 0 10px rgba(255,197,49,.7),0 1px 0 rgba(0,0,0,.3);left:0;top:0;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.score.pop,.feedback.ok .fb-star,.feedback.no{animation:none}.burst{display:none}}
@media (prefers-reduced-motion:no-preference){.hands g{transition:transform .25s ease}.hands.dragging g{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
  <header>
    <h1>Uhrzyt <span>lerne</span></h1>
    <div class="hd">
      <div class="score" id="score" aria-live="polite">★ 0</div>
      <button class="gear" id="gear" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span id="lvlChip">5 Min</span></button>
    </div>
    <button class="tip" id="tip" hidden>Do chasch d'Stufe und d'Tön iistelle.</button>
  </header>

  <nav class="tabs" role="group" aria-label="Modus">
    <button id="t-lern" data-mode="lern" aria-pressed="true">Üebe</button>
    <button id="t-stell" data-mode="stell" aria-pressed="false">Stell d'Uhr</button>
    <button id="t-luege" data-mode="luege" aria-pressed="false">Wie spoot?</button>
  </nav>
  </div>

  <main class="main">
  <div class="clockbox">
    <svg id="clock" viewBox="-28 -28 356 356" aria-label="Uhr">
      <circle class="face" cx="150" cy="150" r="132"/>
      <path id="wedge" class="wedge" d=""/>
      <text class="side" x="200" y="214">ab</text>
      <text class="side" x="100" y="214">vor</text>
      <g id="ticks"></g>
      <g id="nums"></g>
      <g class="hands" id="hands">
        <g id="gh"><line class="hit" x1="150" y1="150" x2="150" y2="82" stroke-width="44"/><line class="hand-h" x1="150" y1="150" x2="150" y2="82"/><circle class="grip-h" cx="150" cy="82" r="12"/></g>
        <g id="gm"><line class="hit" x1="150" y1="150" x2="150" y2="38" stroke-width="44"/><line class="hand-m" x1="150" y1="150" x2="150" y2="38"/><circle class="grip-m" cx="150" cy="38" r="12"/></g>
      </g>
      <circle class="knob" cx="150" cy="150" r="9"/>
    </svg>
  </div>

  <div class="panel">
  <section class="say" id="say" aria-live="polite">
    <span class="label" id="sayLabel">Mer seit</span>
    <span class="ch" id="ch"></span>
    <span class="sub"><span class="de" id="de"></span><span class="dig" id="dig"></span></span>
    <div class="speak" id="speak">
      <button class="play" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>Hochdütsch vorläse</button>
    </div>
  </section>

  <div id="controls" class="row">
    <button class="btn h" id="hm" aria-label="Eis Stund zrugg">− Std</button>
    <button class="btn m" id="mm" aria-label="Füüf Minute zrugg">− 5</button>
    <button class="btn m" id="mp" aria-label="Füüf Minute vorwärts">+ 5</button>
    <button class="btn h" id="hp" aria-label="Eis Stund vorwärts">+ Std</button>
  </div>
  <div id="opts" class="opts" hidden></div>
  <div class="dock" id="dock" hidden>
    <div class="feedback" id="fb"></div>
    <div id="check" class="row" hidden>
      <button class="btn primary" id="go">Prüefe</button>
    </div>
    <div class="row" id="nextRow" hidden><button class="btn primary" id="next">Nöchschti Uufgab</button></div>
  </div>

  <p class="hint" id="hint">Zieh de <b class="m">langi oranschi Zeiger</b> für d'Minute und de <b class="h">churzi blaui Zeiger</b> für d'Stund. Rächts isch «ab», links isch «vor».</p>
  </div>
  </main>
</div>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog" class="sheet">
    <h2 id="setTitle">Iistellige</h2>
    <div class="set-row">
      <span class="set-label" id="lvLabel">Stufe</span>
      <div class="levels" role="group" aria-labelledby="lvLabel">
        <button type="button" id="l1" data-lvl="1" aria-pressed="false">Ganzi &amp; Halbi <small>3:00 · 3:30</small></button>
        <button type="button" id="l2" data-lvl="2" aria-pressed="false">+ Viertel <small>3:15 · 3:45</small></button>
        <button type="button" id="l3" data-lvl="3" aria-pressed="true">Alli 5 Minute <small>3:05 · 3:10 …</small></button>
      </div>
    </div>
    <div class="set-row set-inline">
      <span class="set-label">Tön bi richtig &amp; falsch</span>
      <button type="button" class="toggle" id="mute" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d=""/></svg><span id="muteText">Ii</span></button>
    </div>
    <button class="btn primary" value="close">Fertig</button>
  </form>
</dialog>

<script>
(()=>{
const $=id=>document.getElementById(id);
const CH=["zwölfi","eis","zwei","drüü","vieri","füfi","sächsi","sibni","achti","nüüni","zäni","elfi","zwölfi"];
const DE=["zwölf","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf"];

function phrase(h,m){
  const H=h%12||12, N=H%12+1;
  const hc=`<span class="h">${CH[H]}</span>`, nc=`<span class="h">${CH[N]}</span>`;
  const M=t=>`<span class="m">${t}</span>`;
  const map={
    0:[`Es isch ${hc}`, H===1?"ein Uhr":`${DE[H]} Uhr`],
    5:[`${M("füüf ab")} ${hc}`,`fünf nach ${DE[H]}`],
    10:[`${M("zäh ab")} ${hc}`,`zehn nach ${DE[H]}`],
    15:[`${M("Viertel ab")} ${hc}`,`Viertel nach ${DE[H]}`],
    20:[`${M("zwänzg ab")} ${hc}`,`zwanzig nach ${DE[H]}`],
    25:[`${M("füüf vor halbi")} ${nc}`,`fünf vor halb ${DE[N]}`],
    30:[`${M("halbi")} ${nc}`,`halb ${DE[N]}`],
    35:[`${M("füüf ab halbi")} ${nc}`,`fünf nach halb ${DE[N]}`],
    40:[`${M("zwänzg vor")} ${nc}`,`zwanzig vor ${DE[N]}`],
    45:[`${M("Viertel vor")} ${nc}`,`Viertel vor ${DE[N]}`],
    50:[`${M("zäh vor")} ${nc}`,`zehn vor ${DE[N]}`],
    55:[`${M("füüf vor")} ${nc}`,`fünf vor ${DE[N]}`]
  };
  return {ch:map[m][0], de:map[m][1], plain:map[m][0].replace(/<[^>]+>/g,"")};
}
/* text to speech: Hochdeutsch only, and only from a real tap on the play button */
let cur=null, lastDragEnd=0;
try{localStorage.removeItem("uhr-voice")}catch(e){}
const tts="speechSynthesis" in window;
const hush=()=>{if(tts)speechSynthesis.cancel()};
function pickVoice(){
  const vs=tts?speechSynthesis.getVoices():[];
  return vs.find(v=>/de[-_]CH/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null;
}
function speak(e){
  if(!tts||!cur||!e||!e.isTrusted) return;
  if(Date.now()-lastDragEnd<600) return; // a drag that ends on the button is not a tap
  const txt=/Uhr$/.test(cur.de)?"Es ist "+cur.de:cur.de;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt); const v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang="de-CH";
  u.rate=.85; speechSynthesis.speak(u);
}
/* feedback sounds, synthesized; they only follow an answer the child just tapped */
let actx=null, soundOn=true;
try{soundOn=localStorage.getItem("uhr-sound")!=="off"}catch(e){}
const ICON_ON="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z";
const ICON_OFF="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z";
function tone(f0,f1,t,dur,type,vol){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
function sfx(ok){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+.02;
    if(ok){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,f,t+i*.09,.32,"triangle",.22)); tone(2093,2093,t+.36,.4,"sine",.06); }
    else { tone(311,233,t,.22,"triangle",.22); tone(233,175,t+.2,.3,"triangle",.2); }
  }catch(e){}
}
function setSound(on){
  soundOn=on; $("muteIcon").setAttribute("d",on?ICON_ON:ICON_OFF);
  $("mute").setAttribute("aria-pressed",on); $("muteText").textContent=on?"Ii":"Us";
  try{localStorage.setItem("uhr-sound",on?"on":"off")}catch(e){}
}
const dig=(h,m)=>`${h%12||12}:${String(m).padStart(2,"0")}`;

/* clock face */
const ticks=$("ticks"), nums=$("nums"), NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
for(let i=0;i<60;i++){
  const a=i*6*Math.PI/180, big=i%5===0, r1=big?116:122, r2=128;
  ticks.append(el("line",{class:"tick",x1:150+r1*Math.sin(a),y1:150-r1*Math.cos(a),x2:150+r2*Math.sin(a),y2:150-r2*Math.cos(a),"stroke-width":big?4:1.5}));
}
for(let i=1;i<=12;i++){
  const a=i*30*Math.PI/180;
  const t=el("text",{class:"num",x:150+96*Math.sin(a),y:150-96*Math.cos(a)});t.textContent=i;nums.append(t);
  const mt=el("text",{class:"mnum",x:150+148*Math.sin(a),y:150-148*Math.cos(a)});mt.textContent=String(i*5%60).padStart(2,"0");nums.append(mt);
}

/* state */
let h=3, m=15, mode="lern", lvl=3, score=0, target=null, locked=false;
let hAngle=0, mAngle=0;
try{score=+localStorage.getItem("uhr-score")||0}catch(e){}
/* where the child left off: mode, level and the practice clock */
try{
  const st=JSON.parse(localStorage.getItem("uhr-state")||"{}");
  if(["lern","stell","luege"].includes(st.mode)) mode=st.mode;
  if([1,2,3].includes(st.lvl)) lvl=st.lvl;
  if(st.h>=1&&st.h<=12&&st.m>=0&&st.m<60&&st.m%5===0){h=st.h;m=st.m}
}catch(e){}
let practice={h,m};
function saveState(){try{localStorage.setItem("uhr-state",JSON.stringify({mode,lvl,h:practice.h,m:practice.m}))}catch(e){}}

function wedgePath(min){
  if(min===0) return "";
  const a=min*6*Math.PI/180, r=130, x=150+r*Math.sin(a), y=150-r*Math.cos(a);
  return `M150 150 L150 20 A${r} ${r} 0 ${min>30?1:0} 1 ${x} ${y} Z`;
}
function setAngle(cur,next){ // shortest rotation, keeps animation smooth across 12
  let d=((next-cur)%360+540)%360-180; return cur+d;
}
function draw(){
  mAngle=setAngle(mAngle,m*6);
  hAngle=setAngle(hAngle,((h%12)+m/60)*30);
  $("gm").style.transform=`rotate(${mAngle}deg)`;
  $("gh").style.transform=`rotate(${hAngle}deg)`;
  $("gm").style.transformOrigin=$("gh").style.transformOrigin="150px 150px";
  $("wedge").setAttribute("d",wedgePath(m));
  if(mode==="lern"){
    if(practice.h!==h||practice.m!==m){practice={h,m};saveState();}
    const p=phrase(h,m);
    $("ch").innerHTML=p.ch; $("de").textContent="Hochdütsch: "+p.de; $("dig").textContent=dig(h,m);
    cur=p; $("speak").hidden=!tts;
  }
}
function showTarget(){
  if(mode==="stell"){
    const p=phrase(target.h,target.m);
    $("sayLabel").textContent="Stell d'Uhr uf";
    $("ch").innerHTML=p.ch; $("de").textContent=""; $("dig").textContent="";
    cur=p; $("speak").hidden=!tts;
  } else if(mode==="luege"){
    cur=null; $("speak").hidden=true;
    $("sayLabel").textContent="Wie spoot isch es?";
    $("ch").innerHTML="?"; $("de").textContent=""; $("dig").textContent=""; $("say").classList.add("ask");
  }
}
function randTime(){
  const pool={1:[0,30],2:[0,15,30,45],3:[0,5,10,15,20,25,30,35,40,45,50,55]}[lvl];
  return {h:1+Math.floor(Math.random()*12), m:pool[Math.floor(Math.random()*pool.length)]};
}
function starBurst(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const from=$("fb").getBoundingClientRect(), to=$("score").getBoundingClientRect();
  const x0=from.left+from.width/2, y0=from.top+from.height/2, x1=to.left+to.width/2-14, y1=to.top+to.height/2-16;
  const N=10;
  for(let i=0;i<N;i++){
    const s=document.createElement("span"); s.className="burst"; s.textContent="★"; document.body.append(s);
    const a=Math.PI*2*i/N+Math.random()*.4, r=80+Math.random()*70, mx=x0+Math.cos(a)*r, my=y0+Math.sin(a)*r*.8;
    const fly=i>=N-3, last=i===N-1; // the last three fly up into the score
    s.animate([
      {transform:`translate(${x0-14}px,${y0-16}px) scale(.2) rotate(0deg)`,opacity:0},
      {transform:`translate(${mx-14}px,${my-16}px) scale(1.2) rotate(${120+i*20}deg)`,opacity:1,offset:.35},
      fly?{transform:`translate(${x1}px,${y1}px) scale(.6) rotate(360deg)`,opacity:1}
         :{transform:`translate(${mx-14}px,${my+50}px) scale(.5) rotate(${240+i*20}deg)`,opacity:0}
    ],{duration:fly?900+(i-N+3)*90:900+i*30,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"}).onfinish=()=>{
      s.remove(); if(last){ $("score").classList.remove("pop"); void $("score").offsetWidth; $("score").classList.add("pop"); }
    };
  }
}
function setScore(d){score=Math.max(0,score+d);$("score").textContent="★ "+score;try{localStorage.setItem("uhr-score",score)}catch(e){}}

function syncDock(){
  $("dock").hidden=mode==="lern"||($("check").hidden&&$("nextRow").hidden&&!$("fb").textContent);
}
function newTask(){
  hush(); locked=false; $("fb").textContent=""; $("fb").className="feedback"; $("nextRow").hidden=true; $("check").hidden=mode!=="stell";
  target=randTime();
  if(mode==="stell"){ h=12; m=0; draw(); showTarget(); }
  if(mode==="luege"){
    h=target.h; m=target.m; draw(); showTarget();
    const set=new Map([[`${target.h}:${target.m}`,target]]);
    while(set.size<3){
      // tricky distractors: same minute other hour, or mirrored ab/vor
      const r=Math.random(), t= r<.4?{h:target.h%12+1,m:target.m}: r<.7?{h:target.h,m:(60-target.m)%60}:randTime();
      set.set(`${t.h}:${t.m}`,t);
    }
    const arr=[...set.values()].sort(()=>Math.random()-.5);
    const box=$("opts"); box.innerHTML="";
    arr.forEach((t,i)=>{
      const b=document.createElement("button"); b.className="btn"; b.id="opt"+i;
      b.textContent=phrase(t.h,t.m).plain;
      b.onclick=()=>{
        if(locked) return;
        const ok=t.h===target.h&&t.m===target.m;
        if(ok){ locked=true; b.classList.add("right"); win(); }
        else { b.classList.add("wrong"); lose(); }
      };
      box.append(b);
    });
  }
  syncDock();
}
function win(){
  misses=0; $("say").classList.remove("ask");
  const p=phrase(target.h,target.m);
  $("fb").innerHTML=["Super!","Bravo!","Genau so!","Toll gmacht!"][Math.floor(Math.random()*4)]+' <span class="fb-star">★</span>';
  $("fb").className="feedback"; void $("fb").offsetWidth; $("fb").className="feedback ok";
  sfx(true); setScore(1);
  $("sayLabel").textContent="Richtig"; $("ch").innerHTML=p.ch; $("de").textContent="Hochdütsch: "+p.de; $("dig").textContent=dig(target.h,target.m);
  cur=p; $("speak").hidden=!tts;
  $("check").hidden=true; $("nextRow").hidden=false; syncDock(); starBurst();
}
function lose(){
  // three misses in a row: point at the settings once per level and session, if an easier level exists
  if(++misses>=3&&lvl>1&&!offered.has(lvl)){ offered.add(lvl); showTip("Z'schwär? Do chasch e liechteri Stufe wähle."); }
  sfx(false); $("fb").textContent="Fasch! Probier nomal.";
  $("fb").className="feedback"; void $("fb").offsetWidth; $("fb").className="feedback no"; syncDock();
}

function setMode(md){
  hush(); locked=false; $("say").classList.remove("ask"); document.body.dataset.mode=md; if(md==="lern"&&mode!=="lern"){h=practice.h;m=practice.m}
  mode=md; saveState();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===md));
  $("controls").hidden=md==="luege"; $("check").hidden=md!=="stell"; $("opts").hidden=md!=="luege";
  $("hint").hidden=md==="luege";
  $("fb").textContent=""; $("nextRow").hidden=true;
  if(md==="lern"){ $("sayLabel").textContent="Mer seit"; draw(); snapM(); syncDock(); } else newTask();
}

/* controls */
const gran=()=>({1:30,2:15,3:5})[lvl];
function snapM(){ const g=gran(); if(m%g){ m=Math.round(m/g)*g; if(m===60){m=0;h=h%12+1} draw(); } }
const LVL_SHORT={1:"Halbi",2:"Viertel",3:"5 Min"}, LVL_LONG={1:"Ganzi & Halbi",2:"+ Viertel",3:"Alli 5 Minute"};
function labelSteps(){ const g=gran(); $("mp").textContent="+ "+g; $("mm").textContent="− "+g;
  $("lvlChip").textContent=LVL_SHORT[lvl]; $("gear").setAttribute("aria-label","Iistellige – Stufe: "+LVL_LONG[lvl]);
  $("mp").setAttribute("aria-label",g+" Minute vorwärts"); $("mm").setAttribute("aria-label",g+" Minute zrugg"); }
function step(dm){ let t=h*60+m+dm; t=((t%720)+720)%720; h=Math.floor(t/60)||12; m=t%60; draw(); }
$("mp").onclick=()=>step(gran()); $("mm").onclick=()=>step(-gran());
$("hp").onclick=()=>step(60); $("hm").onclick=()=>step(-60);
$("go").onclick=()=>{ if(locked) return; if(h%12===target.h%12&&m===target.m){locked=true;win();} else lose(); };
$("next").onclick=newTask;
$("play").onclick=speak;
$("mute").onclick=()=>setSound(!soundOn);
const dlg=$("settings");
/* first launch: point at the settings once; gone for good after the tip or the settings are opened */
let tipSeen=true; try{tipSeen=!!localStorage.getItem("uhr-tip")}catch(e){}
let misses=0; const offered=new Set();
function showTip(text){ if(text) $("tip").textContent=text; $("tip").hidden=false; $("gear").classList.add("new"); }
function hideTip(){ $("tip").hidden=true; $("gear").classList.remove("new"); try{localStorage.setItem("uhr-tip","1")}catch(e){} }
if(!tipSeen) showTip();
$("tip").onclick=hideTip;
$("gear").onclick=()=>{ hush(); hideTip(); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); };
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); }); // tap outside closes
if(tts) speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener("visibilitychange",()=>{if(document.hidden)hush()});
window.addEventListener("pagehide",hush);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll(".levels button").forEach(b=>b.onclick=()=>{
  lvl=+b.dataset.lvl; document.querySelectorAll(".levels button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  misses=0; saveState(); labelSteps(); if(mode!=="lern") newTask(); else snapM();
});

/* dragging */
const svg=$("clock"); let drag=null, acc=0, lastA=0;
function pt(e){const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return{x:q.x-150,y:q.y-150}}
const angOf=p=>(Math.atan2(p.x,-p.y)*180/Math.PI+360)%360;
const angDiff=(a,b)=>Math.abs(((a-b)%360+540)%360-180);
svg.addEventListener("pointerdown",e=>{
  if(mode==="luege"||locked||!e.isPrimary) return;
  e.preventDefault();
  const p=pt(e), d=Math.hypot(p.x,p.y), a=angOf(p);
  const dH=angDiff(a,((h%12)+m/60)*30), dM=angDiff(a,m*6);
  // hour hand: anywhere near it inside the face; on overlap the inner part means hour
  drag=(d<100 && dH<45 && (dH<dM || d<80)) ? "h" : "m";
  svg.setPointerCapture(e.pointerId); $("hands").classList.add("dragging");
  $(drag==="h"?"gh":"gm").classList.add("active");
  if(drag==="m"){ // tap sets the minute directly, without touching the hour
    const nm=Math.round(a/6/gran())*gran()%60; if(nm!==m){m=nm;draw();}
    acc=(h%12)*60+m+((a/6-m)%60+90)%60-30; lastA=a; // finger position in minutes, followed as it turns
  } else move(e);
});
function move(e){
  if(!drag) return;
  const a=angOf(pt(e)), g=gran();
  if(drag==="m"){
    // follow the finger's actual turning, so passing 12 carries the hour forwards or back
    acc+=(((a-lastA)%360+540)%360-180)/6; lastA=a;
    const t=((Math.round(acc/g)*g)%720+720)%720, nh=Math.floor(t/60)||12, nm=t%60;
    if(nh!==h||nm!==m){h=nh;m=nm;draw();}
  } else {
    const nh=Math.round((a-m/2)/30+12)%12||12; if(nh!==h){h=nh;draw();}
  }
}
svg.addEventListener("pointermove",move);
const end=()=>{if(drag)lastDragEnd=Date.now();drag=null;$("hands").classList.remove("dragging");$("gh").classList.remove("active");$("gm").classList.remove("active")};
svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);

document.querySelectorAll(".levels button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.lvl===lvl));
setScore(0); setSound(soundOn); labelSteps(); setMode(mode);
// no offline cache when testing locally, so edits show on a plain reload
const local=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if(local&&"serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
else if(document.querySelector('link[rel="manifest"]')&&"serviceWorker" in navigator){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
})();
</script>

</body>

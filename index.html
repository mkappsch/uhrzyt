<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uhrzyt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Uhrzyt Lerne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="app.css">

</head>
<body>
<div class="wrap">
  <div class="top">
  <header>
    <h1>Uhrzyt <span>lerne</span></h1>
    <div class="hd">
      <button class="score" id="score" aria-live="polite">★ 0</button>
      <button class="gear" id="gear" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span class="flag" id="gearFlag" aria-hidden="true"></span><span id="lvlChip">5 Min</span></button>
    </div>
    <button class="tip" id="tip" hidden>Do chasch d'Stufe und d'Tön iistelle.</button>
  </header>

  <nav class="tabs" role="group" aria-label="Modus">
    <button id="t-lern" data-mode="lern" aria-pressed="true">Üebe</button>
    <button id="t-stell" data-mode="stell" aria-pressed="false">Stell d'Uhr</button>
    <button id="t-luege" data-mode="luege" aria-pressed="false">Wie spoot?</button>
  </nav>
  </div>

  <main class="main">
  <div class="clockbox">
    <svg id="clock" viewBox="-28 -28 356 356" aria-label="Uhr">
      <circle class="face" cx="150" cy="150" r="132"/>
      <path id="wedge" class="wedge" d=""/>
      <text class="side" id="sideA" x="200" y="214">ab</text>
      <text class="side" id="sideB" x="100" y="214">vor</text>
      <g id="ticks"></g>
      <g id="nums"></g>
      <g class="hands" id="hands">
        <g id="gh"><line class="hit" x1="150" y1="150" x2="150" y2="82" stroke-width="44"/><line class="hand-h" x1="150" y1="150" x2="150" y2="82"/><circle class="grip-h" cx="150" cy="82" r="12"/></g>
        <g id="gm"><line class="hit" x1="150" y1="150" x2="150" y2="38" stroke-width="44"/><line class="hand-m" x1="150" y1="150" x2="150" y2="38"/><circle class="grip-m" cx="150" cy="38" r="12"/></g>
      </g>
      <circle class="knob" cx="150" cy="150" r="9"/>
    </svg>
  </div>

  <div class="panel">
  <section class="say" id="say" aria-live="polite">
    <span class="label" id="sayLabel">Mer seit</span>
    <span class="ch" id="ch"></span>
    <span class="sub"><span class="de" id="de"></span><span class="dig" id="dig"></span></span>
    <div class="speak" id="speak">
      <button class="play" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    </div>
  </section>

  <div id="controls" class="row">
    <button class="btn h" id="hm" aria-label="Eis Stund zrugg">− Std</button>
    <button class="btn m" id="mm" aria-label="Füüf Minute zrugg">− 5</button>
    <button class="btn" id="now">Jetzt</button>
    <button class="btn m" id="mp" aria-label="Füüf Minute vorwärts">+ 5</button>
    <button class="btn h" id="hp" aria-label="Eis Stund vorwärts">+ Std</button>
  </div>
  <div id="opts" class="opts" hidden></div>
  <div class="dock" id="dock" hidden>
    <div class="feedback" id="fb"></div>
    <div class="row" id="showRow" hidden><button class="btn soft" id="show">Zeig mer's</button></div>
    <div id="check" class="row" hidden>
      <button class="btn primary" id="go">Prüefe</button>
    </div>
    <div class="row" id="nextRow" hidden><button class="btn primary" id="next">Nöchschti Uufgab</button></div>
  </div>

  <p class="hint" id="hint">Zieh de <b class="m">langi oranschi Zeiger</b> für d'Minute und de <b class="h">churzi blaui Zeiger</b> für d'Stund. Rächts isch «ab», links isch «vor».</p>
  </div>
  </main>
</div>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="setTitle">Iistellige</h2>
      <button class="btn primary" value="close" id="done">Fertig</button>
    </div>
    <div class="set-row">
      <span class="set-label" id="langLabel">Sprooch</span>
      <button type="button" class="pick" id="langPick" aria-haspopup="dialog" aria-describedby="langLabel"><span class="flag" id="langFlag" aria-hidden="true"></span><span id="langName"></span><span class="chev" aria-hidden="true">›</span></button>
    </div>
    <div class="set-row">
      <span class="set-label" id="lvLabel">Stufe</span>
      <div class="levels" role="group" aria-labelledby="lvLabel">
        <button type="button" id="l1" data-lvl="1" aria-pressed="false">Ganzi &amp; Halbi <small>3:00 · 3:30</small></button>
        <button type="button" id="l2" data-lvl="2" aria-pressed="false">+ Viertel <small>3:15 · 3:45</small></button>
        <button type="button" id="l3" data-lvl="3" aria-pressed="true">Alli 5 Minute <small>3:05 · 3:10 …</small></button>
        <button type="button" id="l4" data-lvl="4" aria-pressed="false">Alli Minute <small>3:07 · 3:42 …</small></button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label" id="extraLabel">Extras</span>
      <div class="toggles">
        <button type="button" class="toggle" id="mute" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d=""/></svg><span id="soundLabel">Tön</span><span class="st" id="muteText">Ii</span></button>
        <button type="button" class="toggle" id="digi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.6-13H11v6.2l5.1 3.1.8-1.3-4.3-2.6V7z"/></svg><span id="digiLabel">24 h</span><span class="st" id="digiText">Us</span></button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="langDlg" aria-labelledby="langTitle">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="langTitle">Sprooch</h2>
      <button class="btn primary" value="close" id="langDone">Fertig</button>
    </div>
    <div class="langlist" id="langs" role="radiogroup" aria-labelledby="langTitle"></div>
  </form>
</dialog>

<dialog id="album" aria-labelledby="albTitle">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="albTitle">Dini Stärn</h2>
      <button class="btn primary" value="close" id="albDone">Fertig</button>
    </div>
    <div class="alb-top"><span class="alb-stars" id="albStars">★ 0</span><span class="alb-streak" id="albStreak"></span></div>
    <div class="badges" id="badges"></div>
    <p class="alb-sec" id="medLabel">Medaille pro Stufe</p>
    <div class="medals" id="medals"></div>
    <p class="alb-next" id="albNext"></p>
  </form>
</dialog>

<script>
/* language registry: every file in lang/ calls Uhrzyt.addLanguage(code, definition) — see LANGUAGES.md */
window.Uhrzyt={langs:{},addLanguage(code,def){this.langs[code]=def},
  min:t=>`<span class="m">${t}</span>`, hour:t=>`<span class="h">${t}</span>`};
</script>
<!-- languages, in the order they appear in the app -->
<script src="lang/ch-zh.js"></script>
<script src="lang/ch-ag.js"></script>
<script src="lang/de.js"></script>
<script src="lang/en.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/it.js"></script>
<script src="lang/th.js"></script>
<script src="app.js"></script>

</body>
</html>
